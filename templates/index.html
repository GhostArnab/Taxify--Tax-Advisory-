<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaxiFy — AI-Powered Tax Planning</title>
    <meta name="description" content="TaxiFy is your AI-powered tax planning assistant for Indian salaried individuals. Upload your salary slip and get personalized tax advice.">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="bg-mesh"></div>
    <div class="page-wrapper">
        <div class="glass-card" style="text-align: center;">
            <div class="brand">
                <div class="brand-logo">
                    <span class="logo-icon">⚡</span>TaxiFy
                </div>
                <p class="brand-tagline">AI-powered tax planning for salaried individuals</p>
            </div>
            <div class="divider"></div>
            <div style="margin: 2rem 0;">
                <div style="display: flex; gap: 1.2rem; justify-content: center; margin-bottom: 1.5rem; flex-wrap: wrap;">
                    <div style="display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); font-size: 0.85rem;">
                        <span style="color: var(--accent-primary); font-size: 1.1rem;">📄</span> Upload Salary Slip
                    </div>
                    <div style="color: var(--text-muted);">→</div>
                    <div style="display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); font-size: 0.85rem;">
                        <span style="color: var(--accent-primary); font-size: 1.1rem;">🤖</span> AI Extracts Data
                    </div>
                    <div style="color: var(--text-muted);">→</div>
                    <div style="display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); font-size: 0.85rem;">
                        <span style="color: var(--accent-primary); font-size: 1.1rem;">💡</span> Get Tax Advice
                    </div>
                </div>
            </div>
            <form action="/upload" method="get">
                <button class="btn btn-primary btn-full" type="submit">
                    Get Started
                    <span style="font-size: 1.1rem;">→</span>
                </button>
            </form>
            <p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted);">
                Powered by Google Gemini AI · Indian Tax Rules FY 2025-26
            </p>
        </div>
    </div>
</body>
</html>
